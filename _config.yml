# Hexo configuration
title: NoteBridge
subtitle: Notes published from NoteBridge
description: A blog generated automatically from Markdown files.
keywords:
  - notes
  - notebridge
author: Ckxkx
language: zh-CN
timezone: Asia/Shanghai

# GitHub Pages project-site URL
url: https://ckxkx.github.io/notebridge-test
root: /notebridge-test/
permalink: :year/:month/:day/:title/

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories

new_post_name: :title.md
default_layout: post
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# Prefix root path for images such as ![](/imgs/example.png)
marked:
  prependRoot: true

index_generator:
  path: ''
  per_page: 10
  order_by: -date

default_category: uncategorized
theme: landscape

date_format: YYYY-MM-DD
time_format: HH:mm:ss

pretty_urls:
  trailing_index: false
  trailing_html: false
